; ============================================================
; claude-desktop-buddy — CYD port
; Board: ESP32-2432S028R ("Cheap Yellow Display", USB-C variant)
;   ILI9341 320x240, XPT2046 resistive touch, no IMU/PMIC/RTC.
; The original M5StickC Plus env is preserved below for reference.
; ============================================================

[env:cyd]
; Pin to a v6.x release of espressif32 — that ships arduino-esp32 v2.0.x,
; whose Bluedroid BLE API (BLEDevice.h, BLESecurityCallbacks, BLE2902) and
; LEDC API (ledcSetup/ledcAttachPin/ledcWriteTone) both match what main.cpp,
; ble_bridge.cpp, and hal_m5.cpp rely on. arduino-esp32 v3 (shipped by
; espressif32 v7+) renames both surfaces and would fail to compile.
platform = espressif32@~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_freq = 80m
build_src_filter = +<*> +<buddies/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ── TFT_eSPI driver — CYD ILI9341 (UPPERCASE required) ──
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; Silences a TFT_eSPI build warning. We don't use TFT_eSPI's touch
    ; helpers (we drive XPT2046 directly via the PaulStoffregen lib), so
    ; this define has no runtime effect.
    -DTOUCH_CS=33
    ; built-in GLCD font drives setTextSize/print/drawString in the buddy UI;
    ; FONT2/4 give the clock crisper large glyphs
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; CYD has no IMU/PMIC/RTC; the HAL shim (hal_m5.*) emulates the M5 API
    -DBUDDY_CYD=1
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ; NimBLE replaces arduino-esp32's Bluedroid stack — ~80 KB less RAM
    ; and ~150 KB less flash, which is what makes WiFi+HTTPS+full-sprite UI
    ; fit on the plain ESP32. Same Nordic UART wire protocol, transparent
    ; to the desktop bridge.
    h2zero/NimBLE-Arduino @ ^1.4.1
lib_ignore =
    ; Prevent the framework's Bluedroid BLE library from being auto-linked;
    ; ble_bridge.cpp doesn't reference its headers any more.
    BLE

; ── Original target, kept for upstream reference (not built) ──
[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
